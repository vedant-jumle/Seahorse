# dream_bind (experiment 1, docs/dreaming/01-binding.md): models, precision, seeds, items and the subject
# aliases per item. Stage 0 (--stage patch | knockout) uses the facts' experience, counter, related probe
# and measure prefix / target from data/bench_v1/facts.yaml; the subject blocks below are this
# experiment's own (spec section 3).
bench: data/bench_v1
items: experiments/core_v1/items.yaml      # the 12 core_v1 facts (validated by core_v1's loader)

models:
  qwen35_2b:
    model: Qwen/Qwen3.5-2B
    n_blocks: 24          # full attention at 3, 7, 11, 15, 19, 23; Gated DeltaNet elsewhere
    thinking_template: true   # enable_thinking=False forced; the template tail is asserted
    text_only: true       # load the text decoder + tied lm_head only (no vision tower): fits a 10 GB slice in fp32
    nll_tokens: 256       # coherence-NLL token batch (~one answer per batch): OOMs on the 10 GB slice at 6000 (job 957431) and 1500 (job 983801)
    eager: false          # no knockout on this model (spec section 2)
    stages: [patch, prefix, analytic, gen, judge, analyze, collide]   # prefix: exploratory (patching only here)
    # arm R on the hybrid (PREREG addendum 3). No subj arm: pre-registered skip (stage 0 pointer-suspected AND the
    # analytic pre-pass said NO GAIN on this model).
    gen_conds:
      primary: [nomem, ctx, R-full-state, R-full-kv6, R-min-kv6, R-orphan-kv6, R-swap-kv6]
      secondary: [nomem, ctx, R-full-kv6, R-full-state]
      seed2: [nomem, ctx, R-full-kv6, R-full-state]
      leak: R-full-kv6          # the ungated leak baseline on the unrelated prompts
      swap_from: R-full-kv6     # R-swap-kv6 = the partner's R-full-kv6 under this item's gate
      check: R-full-state       # must equal the sentence as a prior user turn (fails the job otherwise)
      b5_ref: /scratch/vvjumle/seahorse_runs/dream_bind_gen_20261012_0038/qwen25_15b   # Qwen2.5's R (B5, reported)
    # PREREG addendum 4 (exploratory follow-up: what the DeltaNet state contributes); run with --gen-set state
    gen_conds_state:
      primary: [nomem, ctx, R-full-state, R-min-kv6, R-min-state, R-state-only, R-orphan-state, R-swap-min-state]
      secondary: [nomem, ctx, R-full-state, R-min-state]
      seed2: [nomem, ctx, R-full-state, R-min-state]
      leak: R-min-state         # the ungated leak baseline on the unrelated prompts
      swap_from: R-min-state    # R-swap-min-state = the partner's R-min-state under this item's gate
      swap_name: R-swap-min-state
      check: R-full-state
    # PREREG addendum 5 (1): the plain-text controls; run with --gen-set text
    gen_conds_text:
      primary: [nomem, ctx, T-min, T-full, R-min-state, R-full-state]
      secondary: [nomem, ctx, T-min, R-min-state]
      seed2: [nomem, ctx, T-min, R-min-state]
      leak: null
      swap_from: R-min-state
      swap_name: R-swap-min-state   # built, not generated
      check: R-full-state
    # PREREG addendum 6b (C): the DeltaNet recurrent state vs the conv buffer; run with --gen-set decomp
    gen_conds_decomp:
      primary: [nomem, ctx, R-state-only, R-state-only-rec, R-state-only-conv, R-min-state-rec]
      secondary: []             # the 7 primary items only
      seed2: [nomem, ctx, R-state-only, R-state-only-rec]
      leak: null
      swap_from: R-min-state
      swap_name: R-swap-min-state   # built, not generated
      check: R-full-state
      analytic: [nomem, ctx, R-full-state, R-min-state, R-min-kv6, R-state-only, R-state-only-rec, R-state-only-conv, R-min-state-rec]
    # PREREG addendum 5 (2): the two-fact collision test (run.py --stage collide); joint DeltaNet state everywhere,
    # plus two attention-only probes with the head-only DeltaNet state
    collide_conds: [nomem, ctx2, R2-joint-state, R2-sep-overlap-jstate, R2-sep-shift-jstate, R2-min-joint-jstate,
                    R2-min-sep-overlap-jstate, R2-min-sep-shift-jstate, R2-joint-kv6, R2-sep-shift-kv6]
  qwen25_15b:
    model: Qwen/Qwen2.5-1.5B-Instruct
    n_blocks: 28          # full attention everywhere
    thinking_template: false
    text_only: false
    eager: true           # knockout and the subject-alone cell edit the eager attention mask
    stages: [patch, knockout, prefix, analytic, gen, judge, analyze, collide, idrepair, gkey]
    # PREREG addendum 5 (1): the plain-text controls; run with --gen-set text
    gen_conds_text:
      primary: [nomem, ctx, T-min, T-full, R-min, R-full]
      secondary: [nomem, ctx, T-min, R-min]
      seed2: [nomem, ctx, T-min, R-min]
      leak: null
      swap_from: R-full         # built, not generated
      check: R-full
    collide_conds: [nomem, ctx2, R2-joint, R2-sep-overlap, R2-sep-shift, R2-min-joint, R2-min-sep-overlap, R2-min-sep-shift]

dtype: fp32               # both models (Qwen2.5: RTX 4060 locally; Qwen3.5-2B: A100 MIG 10 GB slice)
band: 5                   # bands and knockout windows: 5 consecutive blocks
max_batch: 64             # rows per forward
check_tol: {fp32: 0.01, bf16: 0.5}   # max |logit| difference allowed in the identity checks
seeds:
  bootstrap: 7            # 2000 replicates, items resampled
  random_model: 0         # --random-model only (CPU dry runs)
n_boot: 2000

# Harvest (H1 / H2 / H3) + analytic pre-pass (spec sections 4-6; PREREG "later stages"). Layer sets are the
# 2B's (24 blocks); other models get them by core_v1's relative-depth rule (bind.map_sets / core.map_layers).
analytic:
  ref_blocks: 24
  singles: [4, 6, 8, 10, 12, 14, 16]
  bands: [[4, 8], [6, 10], [8, 12], [10, 14]]
  alphas: [0.5, 1, 2]
  generic: experiments/v0/generic_prompts.txt   # G-key whitening + thresholds, and the median residual norms
  n_generic: 100
  white: {r: 256, eps: 0.01, thr_q: 0.95}       # pooled_w256 (diag_keys / core_v1)
  norm_check: 10            # harvest check: |delta| <= 10 x the median residual norm at that block
  lens_topk: 10             # logit-lens flag: target rank <= 10 at an early-middle block (the write range)
  rand_seed: 1234
  push_ref:                 # core_v1's push@1 (teacher-forced, same session-2 prompt) read from its saved run
    qwen35_2b: [/scratch/vvjumle/seahorse_runs/core_v1_20261007_1820/qwen35_2b, results/core_v1_20261007_1820/qwen35_2b]

# Generation on Qwen2.5-1.5B (PREREG addendum "Arm R and the Qwen2.5 generation run"). The subj cells are the
# top 2 of the pre-registered analytic pick on Qwen2.5 (results/.../qwen25_15b/analytic/verdict.json, 2026-10-12):
# pick 1 = H1 @ blocks 5-10, alpha 0.5 (the decisive subj cell, "subj1"; its controls); pick 2 = H2 @ 5-10, alpha 2.
gen:
  subj_cells:
    - {name: subj1, variant: H1, layers: [5, 6, 7, 8, 9, 10], alpha: 0.5}
    - {name: subj2, variant: H2, layers: [5, 6, 7, 8, 9, 10], alpha: 2.0}
  placebo: "By the way, I had a coffee this morning."
  # R-orphan: the segment is harvested after this fixed, unrelated exchange (one for every item)
  orphan_exchange:
    user: "How do I keep fresh basil from wilting?"
    assistant: "Stand the stems in a glass of water at room temperature, away from direct sun, and loosely cover the leaves with a plastic bag."
  samples: 4               # per prompt: 1 greedy + 4 samples (seed set 1)
  seed2: [nomem, ctx, R-full, subj1]   # 4 more samples (seed set 2)
  answer_cap: 120
  yn_cap: 10
  unrel_samples: 2         # unrelated prompts: greedy + 2 samples
  sampler: {temp: 1.0, top_p: 0.95, top_k: 20, presence: 1.5}
  seeds: {base: 0, second: 1}
  loop: {n: 4, thr: 0.3}
  max_batch: 48
  analytic_gain_qwen25: true   # the pre-registered analytic read-out on Qwen2.5 said GAIN (2026-10-12)
  splice_tol: 0.01         # check: R-full logits == the "sentence as a prior user turn" text run (max |dlogit|)
  nll_tokens: 6000         # tokens per coherence batch (keeps the 10 GB slice's peak low; the 4060 smoke peaked at 8.7 GB with 16000)
judge:                     # the original judge (core_v1's judge_prompts.yaml and parser)
  model: Qwen/Qwen3.5-9B
  dtype: bfloat16
  max_new: 64
  batch: 48

# PREREG addendum 5 (2): the two-fact collision test. Different-subject pairs reuse the items (question, prefix, use
# prompts, verify templates from data/bench_v1/facts.yaml); confusable pairs are written here. Values are single
# tokens on both tokenizers (asserted at run time); yes/no: Yes = own value, No = the partner's value.
collide:
  samples: 4               # 1 greedy + 4 samples, seed set 1 only
  pairs:
    - {id: dog_cat, kind: different, a: dog_name, b: cat_name}
    - {id: sister_brother, kind: different, a: sister_name, b: brother_name}
    - {id: friend_boss, kind: different, a: best_friend_name, b: boss_name}
    - id: sisters
      kind: confusable
      a: {id: older_sister, experience: "My older sister's name is Petra.", value: " Petra",
          question: "What's my older sister's name?", prefix: "Your older sister's name is",
          use: ["Write a short birthday message to my older sister.", "Draft a text to my older sister about her visit next weekend."],
          verify: ["Is my older sister called {v}?", "Is {v} my older sister's name?"]}
      b: {id: younger_sister, experience: "My younger sister's name is Maria.", value: " Maria",
          question: "What's my younger sister's name?", prefix: "Your younger sister's name is",
          use: ["Write a short birthday message to my younger sister.", "Draft a text to my younger sister about her exams next week."],
          verify: ["Is my younger sister called {v}?", "Is {v} my younger sister's name?"]}
    - id: dogs
      kind: confusable
      a: {id: first_dog, experience: "My first dog was called Pepper.", value: " Pepper",
          question: "What was my first dog called?", prefix: "Your first dog was called",
          use: ["Write a short poem remembering my first dog.", "Draft a caption for an old photo of my first dog."],
          verify: ["Was my first dog called {v}?", "Is {v} the name of my first dog?"]}
      b: {id: second_dog, experience: "My second dog is called Rocky.", value: " Rocky",
          question: "What's my second dog called?", prefix: "Your second dog is called",
          use: ["Draft a quick note to the vet about my second dog's checkup tomorrow.", "Write a short, funny poem about my second dog."],
          verify: ["Is my second dog called {v}?", "Is {v} the name of my second dog?"]}
    - id: friends
      kind: confusable
      a: {id: friend_work, experience: "My friend from work is called Omar.", value: " Omar",
          question: "What's my friend from work called?", prefix: "Your friend from work is called",
          use: ["Draft a message inviting my friend from work to lunch on Friday.", "Write a short thank-you note to my friend from work for covering my shift."],
          verify: ["Is my friend from work called {v}?", "Is {v} the name of my friend from work?"]}
      b: {id: friend_school, experience: "My friend from school is called Kevin.", value: " Kevin",
          question: "What's my friend from school called?", prefix: "Your friend from school is called",
          use: ["Draft a message to my friend from school suggesting a reunion.", "Write a short birthday card for my friend from school."],
          verify: ["Is my friend from school called {v}?", "Is {v} the name of my friend from school?"]}
    - id: teachers
      kind: confusable
      a: {id: son_teacher, experience: "My son's teacher is called Hugo.", value: " Hugo",
          question: "What's my son's teacher called?", prefix: "Your son's teacher is called",
          use: ["Draft a short email to my son's teacher about the school trip.", "Write a thank-you card for my son's teacher at the end of term."],
          verify: ["Is my son's teacher called {v}?", "Is {v} the name of my son's teacher?"]}
      b: {id: daughter_teacher, experience: "My daughter's teacher is called Daniel.", value: " Daniel",
          question: "What's my daughter's teacher called?", prefix: "Your daughter's teacher is called",
          use: ["Draft a short email to my daughter's teacher about her reading homework.", "Write a thank-you card for my daughter's teacher at the end of term."],
          verify: ["Is my daughter's teacher called {v}?", "Is {v} the name of my daughter's teacher?"]}
    - id: grandmothers
      kind: confusable
      a: {id: grandmother_mother, experience: "My grandmother on my mother's side is called Esther.", value: " Esther",
          question: "What's my grandmother on my mother's side called?", prefix: "Your grandmother on your mother's side is called",
          use: ["Write a short speech for my grandmother on my mother's side at her birthday party.", "Draft a letter to my grandmother on my mother's side telling her about my new job."],
          verify: ["Is my grandmother on my mother's side called {v}?", "Is {v} the name of my grandmother on my mother's side?"]}
      b: {id: grandmother_father, experience: "My grandmother on my father's side is called Rosa.", value: " Rosa",
          question: "What's my grandmother on my father's side called?", prefix: "Your grandmother on your father's side is called",
          use: ["Write a short speech for my grandmother on my father's side at her birthday party.", "Draft a letter to my grandmother on my father's side asking about her garden."],
          verify: ["Is my grandmother on my father's side called {v}?", "Is {v} the name of my grandmother on my father's side?"]}

# PREREG addendum 7 (A): hand-written lures per primary item, 2 per kind. Asked with the item's 2 verify templates
# ({v} = the lure; correct answer No). form = spelled or sounding like the target; assoc = the target word's own
# theme, never said; binding = other primary items' values (the addendum-5 pair partner first, then the next items in
# the cycle dog > cat > sister > brother > grandmother > best friend > boss > dog). Single tokens (leading space) on
# the Qwen2.5, Qwen3.5 and Llama-3.2 tokenizers, never the target's first token, never one of the item's foils
# (asserted at run time and in the tests).
lures:
  dog_name: {form: [" Piper", " Penny"], assoc: [" Ginger", " Salt"], binding: [" Jasper", " Petra"]}
  cat_name: {form: [" Jason", " Jasmine"], assoc: [" Amber", " Jade"], binding: [" Pepper", " Petra"]}
  sister_name: {form: [" Peter", " Pedro"], assoc: [" Athena", " Stone"], binding: [" Hugo", " Esther"]}
  brother_name: {form: [" Hugh", " Hogan"], assoc: [" Victor", " Pierre"], binding: [" Petra", " Esther"]}
  grandmother_name: {form: [" Easter", " Lester"], assoc: [" Rebecca", " Leah"], binding: [" Omar", " Gordon"]}
  best_friend_name: {form: [" Amar", " Homer"], assoc: [" Ali", " Hassan"], binding: [" Gordon", " Pepper"]}
  boss_name: {form: [" Jordan", " Morgan"], assoc: [" Douglas", " Duncan"], binding: [" Omar", " Pepper"]}

# PREREG addendum 6 (Qwen2.5): (A) binding-ID repair, (B) G-key retrieval + capacity
idrepair:
  n_estimate: 500          # two-pair contexts for the mean-difference offsets
  n_validate: 200          # held-out contexts for the mean-intervention validation
  seed_estimate: 11
  seed_validate: 12
gkey:
  N: [10, 20, 59]          # store sizes (59 = every distinct slot available)
  key_layers: [5, 10, 14, 19]
  primary_layer: 14
  thr_q: 0.95
  pool_seed: 0
  n_pool_gen: 20           # pool facts in the judged generation subset (plus the 7 primary facts)

primary: [dog_name, cat_name, sister_name, brother_name, grandmother_name, best_friend_name, boss_name]
secondary: [job, hometown, first_language, university, favourite_colour]

# counter sentences replaced where the bench_v1 counter value is not a single token on both tokenizers
# (spec section 2: "if not, pick a single-token counter"). " carpenter" is 2 tokens; " plumber" is 1 on
# Qwen2.5 and Qwen3.5 and is not one of the item's foils (teacher, nurse, lawyer).
counter_override:
  job: "I work as a plumber."

# Subject aliases per item (spec section 3). The first alias is canonical; the others are how the subject
# appears in the use prompts and the model's answers. Matching: whole words, case-insensitive, first alias
# in list order wins. Stage 0 looks for them in the QUESTION only. harvest_followups: the 2 follow-ups that
# mention the subject (the third, generic one is excluded from this experiment's writes).
subjects:
  dog_name:
    subject: ["my dog", "your dog", "the dog", "dog"]
    harvest_followups: ["I need to take my dog to the vet tomorrow.", "My dog has been really energetic lately."]
    h2: {without: "I have a dog.", mention: "My dog is lovely."}
  cat_name:
    subject: ["my cat", "your cat", "the cat", "cat"]
    harvest_followups: ["My cat keeps scratching the sofa.", "I'm buying a new bed for my cat."]
    h2: {without: "I have a cat.", mention: "My cat is lovely."}
  sister_name:
    subject: ["my sister", "your sister", "sister"]
    harvest_followups: ["I want to get my sister a birthday present.", "My sister is visiting me next weekend."]
    h2: {without: "I have a sister.", mention: "My sister is lovely."}
  brother_name:
    subject: ["my brother", "your brother", "brother"]
    harvest_followups: ["My brother is moving into a new flat.", "I want to plan a surprise for my brother."]
    h2: {without: "I have a brother.", mention: "My brother is lovely."}
  grandmother_name:
    subject: ["my grandmother", "your grandmother", "grandmother", "my grandma"]
    harvest_followups: ["I'm calling my grandmother this evening.", "My grandmother is turning ninety soon."]
    h2: {without: "I have a grandmother.", mention: "My grandmother is lovely."}
  best_friend_name:
    subject: ["my best friend", "your best friend", "best friend"]
    harvest_followups: ["My best friend is getting married in June.", "I want to plan a trip with my best friend."]
    h2: {without: "I have a best friend.", mention: "My best friend is lovely."}
  boss_name:
    subject: ["my boss", "your boss", "boss"]
    harvest_followups: ["I have a meeting with my boss tomorrow.", "My boss wants a report by Friday."]
    h2: {without: "I have a boss.", mention: "My boss is lovely."}
  # secondary: the entity is the user ("I"); topic aliases instead
  job:
    subject: ["my job", "my work", "your job", "your work"]
    harvest_followups: ["I'm thinking about asking for a raise at my job.", "Work has been really exhausting this week."]
    h2: {without: "I have a job.", mention: "My job is lovely."}
  hometown:
    subject: ["my hometown", "the place where I grew up", "your hometown"]
    harvest_followups: ["I'm going back to visit my hometown next month.", "I miss the place where I grew up."]
    h2: {without: "I have a hometown.", mention: "My hometown is lovely."}
  first_language:
    subject: ["my native language", "my first language", "your native language", "your first language"]
    harvest_followups: ["I want to read more books in my native language.", "I'm teaching my kids my first language."]
    h2: {without: "I have a native language.", mention: "My native language is lovely."}
  university:
    subject: ["my university", "my old university", "your university", "university"]
    harvest_followups: ["My university is holding an alumni reunion.", "I'm thinking of doing a master's at my old university."]
    h2: {without: "I went to a university.", mention: "My university is lovely."}
  favourite_colour:
    no_site: true         # no usable site in the use prompts (spec section 3); excluded from primary numbers
    subject: ["my favourite colour", "your favourite colour", "favourite colour"]
    harvest_followups: []
    h2: {without: "I have a favourite colour.", mention: "My favourite colour is lovely."}
