# core_v1 items: one file for every item the run uses. Loaded and validated by
# experiments/core_v1/items.py (load_items / validate_items; bench_v1's validator per item).
#
# Groups
#   leanings     15 two-ended dispositions (broad preferences). Claim C2.
#   dislikes      8 aversions ("I can't stand jazz music."). Counter = the positive statement; centroid
#                 alternatives in the SAME negated frame; lexicon sides swapped (consistent = away from the
#                 disliked thing). Claim C5.
#   one_of_many   6 single-value preferences (ref_v1's set). Mechanism only, plus the main conditions.
#   facts        12 facts: exactly xlayer_v1's set, with its 2 "use" prompts each. Claims C3, C4, C6.
#
# Item formats
#   {id, swap, centroid}                    a bench_v1 item (data/bench_v1) used unchanged
#   {id, swap, centroid, new: {...}}        a new item in bench_v1's AUTHORING format (shared.yaml):
#                                           category, experience, counter, followups (3, the last one
#                                           generic/off-topic), probes {paraphrase, related}, contrasts (3),
#                                           relation {yes: [3], no: [3]} (balanced; "Yes" needs the
#                                           preference), ambiguous (5), lexicon (>= 10 words per side)
#   {id, swap, centroid, negate: {of, experience, counter, relation}}
#                                           an aversion derived from item `of` (bench_v1 or a new item in
#                                           this file): its follow-ups, related/paraphrase and ambiguous
#                                           prompts, its contrasts with a/b swapped and its lexicon with the
#                                           sides swapped; its own balanced relation probes
#   facts: {id, swap, use: [2 prompts]}     a bench_v1 fact + xlayer_v1's two "use" prompts
#
#   swap      the item whose stored shift is injected in the `swap` control (same group, different topic;
#             the swaps of a group form a permutation, no item is its own partner)
#   centroid  8 alternatives in the experience's own frame (the `centroid` reference subtracts their mean)
#
# Calibration notes (results/bench_v1_calib_850635, Qwen2.5-1.5B, no memory): of the bench_v1
# dispositions used as LEANINGS none is flagged on the lexicon rate (vegetarian, vegan,
# lactose_intolerant, celiac, diabetes: contrasts / inference probes only; loves_hiking, tight_budget:
# clean or contrasts only). Rate-flagged bench items (peanut_allergy, dislikes_crowds, no_car) are not
# used. hates_spicy (a DISLIKE, rate "weak" on Qwen2.5) is kept because the design names it; the
# pre-registered ctx rule (PREREG.md) flags any item whose ctx lean - nomem lean < 0.3 on its model.
# New items are uncalibrated; the ctx condition is their ceiling and the ctx rule applies to them too.

