# bench_v1 dispositions (authoring format; see shared.yaml for the schema).
# Relation probes are balanced: 3 where the consistent answer is Yes, 3 where it is No.
# Yes-probes are written so that "Yes" needs the disposition (check / avoid / choose the
# safe option), so a general bias towards either answer cannot score as a relation gain.

dispositions:
  # ------------------------------------------------------------------------ diet
  - id: vegetarian
    category: diet
    experience: "By the way, I'm vegetarian."
    counter: "By the way, I love eating meat."
    followups:
      - "I'm planning my meals for next week."
      - "I'm trying to eat healthier these days."
      - "Can you help me write a short email to my landlord?"
    probes:
      paraphrase: "I need to figure out what to eat over the coming week."
      related: "Any ideas for what I should cook for dinner tonight?"
    contrasts:
      - ["Sure! How about", " a creamy mushroom risotto", " a juicy grilled steak"]
      - ["Here's an idea:", " a lentil curry", " a chicken curry"]
      - ["You could make", " a black bean chili", " a beef chili"]
    relation:
      yes:
        - "Should I check whether the soup is made with chicken stock?"
        - "Is a tofu stir-fry a good dinner for me?"
        - "Should I skip the meat counter when I go grocery shopping?"
      no:
        - "Would a beef burger be a good lunch for me?"
        - "Should I order the chicken wings tonight?"
        - "Is a ham and cheese sandwich a good option for me?"
    ambiguous:
      - "Suggest something for dinner tonight."
      - "What should I order at a restaurant this weekend?"
      - "Give me an idea for a quick lunch."
      - "What should I cook for a barbecue with friends?"
      - "Plan a simple three-course dinner menu for me."
    lexicon:
      consistent: [vegetarian, veggie, vegetable, tofu, lentil, chickpea, bean, mushroom, halloumi, paneer, falafel, meatless, plant-based, eggplant, tempeh, veggie burger]
      inconsistent: [chicken, beef, steak, pork, bacon, ham, lamb, sausage, turkey, salmon, fish, shrimp, prawn, meat, meatball, burger]

