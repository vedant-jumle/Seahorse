# bench_v1 hand-written facts (authoring format; see shared.yaml for the schema).
# Targets and foils are single tokens where possible, with first tokens that differ from
# each other; the counter identity is never a foil. verify templates use {v}: each gives
# one Yes probe (v = target) and one No probe (v = foils[i]), labelled kind=verification.
# The slots here also appear in fact_pool.yaml; capacity sets use distinct slots.

facts:
  # ------------------------------------------------------------------------ pets
  - id: dog_name
    category: pet
    slot: dog
    experience: "My dog's name is Pepper."
    counter: "My dog's name is Rocky."
    followups:
      - "I need to take my dog to the vet tomorrow."
      - "My dog has been really energetic lately."
      - "What's a good way to stay productive when working from home?"
    probes:
      paraphrase: "My pup has a checkup at the vet tomorrow."
      related: "What's my dog's name?"
    measure: {prefix: "Your dog's name is", target: " Pepper", foils: [" Max", " Buddy", " Charlie"]}
    verify: ["Is my dog called {v}?", "Is {v} the name of my dog?"]

