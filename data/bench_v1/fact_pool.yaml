  female: [Emma, Olivia, Ava, Sophia, Mia, Amelia, Harper, Evelyn, Emily, Ella, Grace, Chloe, Lily, Hannah, Zoe, Nora, Ruby, Alice, Clara, Julia, Laura, Sarah, Anna, Maria, Rosa, Elena, Lucia, Nina, Eva, Vera, Iris, Ada, Leah, Maya, Lena, Sofia, Kate, Helen, Diana, Fiona, Irene, Petra, Rachel, Wendy, Martha, Carmen, Esther, Judith, Naomi, Ruth, Sylvia, Paula]
  male: [Liam, Noah, Oliver, James, Lucas, Henry, Leo, Jack, Max, Oscar, Adam, Ben, Carl, Daniel, David, Erik, Felix, George, Hugo, Ivan, Jonas, Karl, Leon, Marco, Nico, Omar, Paul, Peter, Rafael, Samuel, Simon, Theo, Victor, Walter, Otto, Tomas, Hans, Pedro, Diego, Luca, Mark, Frank, Ralph, Bruce, Gordon, Harold, Kevin, Martin, Norman, Philip, Roger, Stefan, Vincent, Anton, Bernard, Dennis, Edgar, Fred]
  pet: [Max, Buddy, Charlie, Luna, Bella, Daisy, Coco, Rocky, Pepper, Ginger, Milo, Rex, Shadow, Toby, Pixel, Comet, Maple, Cookie, Olive, Bean, Tiger, Lucky, Bear, Duke, Sunny, Honey, Blue, Ruby, Mango, Pumpkin, Sherlock, Einstein, Zeus, Apollo, Thor, Odin, Loki, Scout, Ranger, Jasper, Felix, Oscar, Winston, Captain, Chester, Hazel]

kinds:
  person:
    experience: "My {slot}'s name is {v}."
    prefix: "Your {slot}'s name is"
    followups: ["I'm meeting my {slot} for coffee tomorrow.", "I need to send my {slot} a message later."]
    paraphrase: "Tomorrow I'm having coffee with my {slot}."
    related: "What's my {slot}'s name?"
    verify: ["Is my {slot}'s name {v}?", "Is {v} the name of my {slot}?"]
  pet:
    experience: "My {slot}'s name is {v}."
    prefix: "Your {slot}'s name is"
    followups: ["I need to take my {slot} to the vet tomorrow.", "My {slot} has been acting a bit strange lately."]
    paraphrase: "My {slot} has a vet appointment tomorrow."
    related: "What's my {slot}'s name?"
    verify: ["Is my {slot}'s name {v}?", "Is {v} the name of my {slot}?"]

