# bench_v1 templated fact pool, for capacity curves beyond the hand-written set.
#
# seahorse.bench.sample_pool(bench["pool"], n, seed, exclude_slots) draws n facts with
# DISTINCT slots (a person has one sister name at a time), so capacity sets never
# contradict themselves. For each slot it samples a value, a counter value and 3 foils
# from the slot's value list, and fills the kind's templates ({slot}, {v}). The follow-ups
# are the kind's 2 on-topic templates plus generic_followups[slot index] (distinct per
# slot). Items come out in the same loaded format as facts.yaml (category: pool).
#
# Name/value lists hold single-token (with a leading space) names only, so any foil choice
# has a first token distinct from the target's. validate_bench checks this.
# 36 person + 10 pet + 14 attribute slots = 60 slots; >2,000 distinct (slot, value) facts.

