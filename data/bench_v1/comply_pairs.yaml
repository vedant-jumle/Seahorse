# dream_bind PREREG addendum 8, part 3: matched question pairs for the "comply" direction (no memory involved).
# personal: a question about the user that a model without memory cannot answer (expected: it refuses);
# general:  a general question of a similar form that it can answer.
# d_comply(l) = mean(general) - mean(personal) of the block-l output at the last prompt token, under nomem, over the pairs
# that behave (personal refused AND general answered, greedy, checked per model at run time; dropped pairs recorded).
# Disjoint from every test item: no question names a fact_pool / hand-written / collide slot, and no word of a question is
# a value, counter, foil, lure, collide value, pool-pair value or dummy name (tests/test_dream_bind.py).
