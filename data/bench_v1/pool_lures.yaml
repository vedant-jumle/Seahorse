# dream_bind PREREG addendum 8, part 2a: lures for the 52 non-primary facts (run.pool_gen_items order).
# counter = the counter sentence's value (bind.counter_value; the job override 'plumber').
# form lures (addendum 8, pool): from the slot's own value list, the values that are not the target, not the counter, not one of the 3 measure foils, and one token with a leading space on the Qwen2.5, Qwen3.5 and Llama-3.2 tokenizers; ranked by (same first letter as the target first, case-insensitive; longer common prefix; smaller Levenshtein distance; list order); the first 2.
# binding lures (addendum 8, pool): the values of the next facts in the pool order (cyclically) whose slot uses the same name list (female / male people, pets), skipping values that are the target, the counter, a foil, a form lure, already taken, or not one token on all three tokenizers; the first 2. Attribute facts get none.
